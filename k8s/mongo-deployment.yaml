apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-mongo
  namespace: healthcare-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthcare-mongo
  template:
    metadata:
      labels:
        app: healthcare-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          emptyDir: {}
